<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расстановка 4-2 в волейболе</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#4b4b4b;
  background-image:
    repeating-linear-gradient(135deg, rgba(255,255,255,.028) 0 2px, rgba(255,255,255,0) 2px 26px),
    radial-gradient(120% 90% at 50% 40%, #585858 0%, #3e3e3e 70%, #303030 100%);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color:#fff;overflow:hidden;
}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#field{
  position:relative;aspect-ratio:720/448;width:min(100vw, 158vh);max-height:100vh;
  container-type:size;container-name:field;
}

/* ---------- Площадка (рисуется в SVG, чтобы разворачиваться в портрет) ---------- */
#board{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}

/* ---------- Игроки ---------- */
#layer{position:absolute;inset:0;pointer-events:none}
.player{
  position:absolute;width:5.4cqw;height:5.4cqw;border-radius:50%;
  transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:2.05cqw;letter-spacing:.02cqw;color:#fff;
  box-shadow:0 .55cqw 1.1cqw rgba(0,0,0,.45), inset 0 -.35cqw .7cqw rgba(0,0,0,.18);
  transition:left .85s cubic-bezier(.45,.05,.2,1), top .85s cubic-bezier(.45,.05,.2,1),
             box-shadow .3s, opacity .3s;
  pointer-events:auto;cursor:default;z-index:5;
}
.player.moving{z-index:8}
.player .zbadge{
  position:absolute;top:-1.15cqw;right:-1.15cqw;width:2.5cqw;height:2.5cqw;border-radius:50%;
  background:#fff;color:#2b2b2b;font-size:1.32cqw;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 .2cqw .5cqw rgba(0,0,0,.4);transition:background .3s,color .3s;
}
.player.srv .zbadge{background:#ffd54a;color:#4a3500}
.player .tip{
  position:absolute;bottom:-2.9cqw;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-size:1.15cqw;font-weight:600;color:rgba(255,255,255,.75);
  background:rgba(0,0,0,.4);padding:.15cqw .6cqw;border-radius:.6cqw;opacity:0;transition:opacity .2s;
}
.player:hover .tip{opacity:1}
.player.hl{box-shadow:0 0 0 .7cqw rgba(255,213,74,.55), 0 .55cqw 1.1cqw rgba(0,0,0,.45)}

#ball{position:absolute;width:4.1cqw;height:4.1cqw;transform:translate(-50%,-50%);
  transition:left .9s cubic-bezier(.3,.7,.4,1), top .9s cubic-bezier(.3,.7,.4,1), opacity .3s;
  z-index:9;filter:drop-shadow(0 .5cqw .7cqw rgba(0,0,0,.5))}
#ball svg{width:100%;height:100%;display:block}

#arrows{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:visible}
#arrows path{fill:none;stroke-linecap:round}

/* ---------- Наложенный интерфейс ---------- */
.ui{position:absolute;z-index:20}
.btn{
  font-family:inherit;font-weight:700;color:#fff;cursor:pointer;
  background:rgba(22,22,22,.62);border:.13cqw solid rgba(255,255,255,.26);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border-radius:.8cqw;height:3.15cqw;padding:0 1.05cqw;font-size:1.1cqw;letter-spacing:.04cqw;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .18s,border-color .18s,transform .12s,opacity .18s;
  white-space:nowrap;text-transform:uppercase;
}
.btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.55)}
.btn:active{transform:translateY(.15cqw)}
.btn[disabled]{opacity:.32;cursor:default;pointer-events:none}
.btn.on{background:#3aa7d8;border-color:rgba(255,255,255,.6);color:#04222f}
.btn.on:hover{background:#4fb9e8}
.btn.accent{background:#e0b028;border-color:rgba(255,255,255,.5);color:#2a2000}
.btn.accent:hover{background:#f2c33c}
.btn.round{padding:0;width:3.15cqw;height:3.15cqw;border-radius:50%;font-size:1.35cqw}
.btn.round.big{width:3.6cqw;height:3.6cqw;font-size:1.5cqw}

/* верх слева — ротация */
#topLeft{left:2.6%;top:2%;display:flex;align-items:center;gap:1cqw}
#rotTitle{font-size:3.1cqw;font-weight:800;letter-spacing:.3cqw;line-height:1;
  text-shadow:0 .3cqw .9cqw rgba(0,0,0,.55);min-width:17cqw}
#rotTitle small{display:block;font-size:1cqw;letter-spacing:.18cqw;font-weight:700;
  color:rgba(255,255,255,.62);margin-top:.5cqw;background:rgba(18,18,18,.6);
  padding:.28cqw .6cqw;border-radius:.5cqw}

/* верх справа — режим */
#topRight{right:2.6%;top:2%;display:flex;flex-direction:column;align-items:flex-end;gap:.9cqw}
#modeTitle{font-size:2.9cqw;font-weight:800;letter-spacing:.4cqw;line-height:1;
  text-shadow:0 .3cqw .9cqw rgba(0,0,0,.55);text-align:right}
#modeSwitch{left:52%;top:2.2%;transform:translateX(-50%)}
.seg{display:flex;background:rgba(22,22,22,.62);border:.13cqw solid rgba(255,255,255,.26);
  border-radius:.9cqw;overflow:hidden;backdrop-filter:blur(6px)}
.seg button{font-family:inherit;border:0;background:transparent;color:rgba(255,255,255,.65);
  font-weight:700;font-size:1.18cqw;letter-spacing:.06cqw;padding:.75cqw 1.3cqw;cursor:pointer;
  text-transform:uppercase;transition:background .18s,color .18s}
.seg button.on{background:#e0b028;color:#2a2000}

/* правая панель — шаги */
#steps{right:2.6%;top:52.2%;transform:translateY(-50%);width:32cqw;
  background:rgba(18,18,18,.68);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  border:.13cqw solid rgba(255,255,255,.18);border-radius:1.1cqw;padding:1.05cqw 1.2cqw 1.1cqw}
#steps h4{font-size:1cqw;letter-spacing:.22cqw;color:rgba(255,255,255,.45);
  text-transform:uppercase;margin-bottom:.6cqw;font-weight:700}
.stepRow{display:flex;align-items:center;gap:.7cqw;padding:.26cqw .45cqw;border-radius:.55cqw;
  cursor:pointer;transition:background .16s}
.stepRow:hover{background:rgba(255,255,255,.08)}
.stepRow .num{flex:0 0 auto;width:1.8cqw;height:1.8cqw;border-radius:50%;
  background:rgba(255,255,255,.14);color:rgba(255,255,255,.6);
  font-size:1cqw;font-weight:800;display:flex;align-items:center;justify-content:center}
.stepRow .lbl{font-size:1.18cqw;font-weight:600;color:rgba(255,255,255,.62);line-height:1.3}
.stepRow.on .num{background:#e0b028;color:#2a2000}
.stepRow.on .lbl{color:#fff;font-weight:800}
.stepRow.done .num{background:rgba(224,176,40,.35);color:#f4d98a}
#stepNow{display:none}
.ovlLeg{margin-top:.6cqw;font-size:1.06cqw;line-height:1.45;color:rgba(255,255,255,.72)}
#stepDesc{margin-top:.75cqw;padding-top:.7cqw;border-top:.13cqw solid rgba(255,255,255,.16);
  font-size:1.17cqw;line-height:1.45;color:rgba(255,255,255,.9)}
#legend{margin-top:.7cqw;padding-top:.6cqw;border-top:.13cqw solid rgba(255,255,255,.12);
  display:flex;flex-wrap:wrap;gap:.25cqw .9cqw}
#legend div{display:flex;align-items:center;gap:.35cqw;font-size:.92cqw;font-weight:600;
  color:rgba(255,255,255,.6);white-space:nowrap}
#legend i{width:1.05cqw;height:1.05cqw;border-radius:50%;display:block;flex:0 0 auto}

/* низ слева — подсказки */
#botBar{left:2.6%;right:2.6%;bottom:3.4%;display:flex;justify-content:space-between;align-items:center}
.grp{display:flex;gap:.7cqw;align-items:center}

/* ---------- Модальные подсказки ---------- */
#modal{position:absolute;left:0;right:0;top:-60cqw;bottom:-60cqw;z-index:60;display:none;
  align-items:center;justify-content:center;
  background:rgba(12,12,12,.74);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#modal.open{display:flex;animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
#modalBox{position:relative;width:min(88cqw,95vw);max-height:94vh;overflow:auto;background:#262626;border-radius:1.4cqw;
  border:.13cqw solid rgba(255,255,255,.18);padding:2cqw 2.4cqw;
  box-shadow:0 2cqw 6cqw rgba(0,0,0,.6);animation:pop .26s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.94) translateY(1.5cqw);opacity:0}to{transform:none;opacity:1}}
#modalBox h2{font-size:2.5cqw;letter-spacing:.14cqw;margin-bottom:.4cqw}
#modalBox .sub{font-size:1.3cqw;color:rgba(255,255,255,.5);margin-bottom:1.5cqw;font-weight:600}
.mcols{display:flex;gap:2.4cqw;align-items:flex-start}
.mcol{flex:1 1 0;min-width:0}
.mfig{flex:0 0 42%}
#modalBox h3{font-size:1.5cqw;margin:1.2cqw 0 .55cqw;color:#f0c74a;letter-spacing:.05cqw}
#modalBox h3:first-child{margin-top:0}
#modalBox p,#modalBox li{font-size:1.32cqw;line-height:1.62;color:rgba(255,255,255,.88)}
#modalBox ul{list-style:none}
#modalBox li{position:relative;padding-left:1.7cqw;margin-bottom:.5cqw}
#modalBox li:before{content:"";position:absolute;left:.25cqw;top:.75cqw;width:.6cqw;height:.6cqw;
  border-radius:50%;background:#e0b028}
#modalBox b{color:#fff}
.note{background:rgba(224,176,40,.12);border-left:.35cqw solid #e0b028;padding:.9cqw 1.2cqw;
  border-radius:.5cqw;margin-top:1.1cqw;font-size:1.3cqw;line-height:1.55}
#modalClose{position:absolute;right:1.1cqw;top:1.1cqw;z-index:61}
.msvg{width:100%;height:auto;display:block;background:rgba(0,0,0,.25);border-radius:1cqw;padding:.6cqw}
.mcap{font-size:1.15cqw;color:rgba(255,255,255,.55);text-align:center;margin-top:.6cqw;font-weight:600}


/* ================= ПОРТРЕТ (телефон) ================= */
@media (max-aspect-ratio: 1/1){
  #field{aspect-ratio:344/840;width:min(100vw, 41vh)}

  .player{width:11.2cqw;height:11.2cqw;font-size:4.3cqw}
  .player .zbadge{width:5.3cqw;height:5.3cqw;font-size:2.85cqw;top:-2.2cqw;right:-2.2cqw}
  .player .tip{display:none}
  #ball{width:8.6cqw;height:8.6cqw}

  .btn{height:7.2cqw;padding:0 2.2cqw;font-size:2.55cqw;border-radius:1.7cqw;letter-spacing:0}
  .btn.round{width:7.2cqw;height:7.2cqw;font-size:3.1cqw}
  .btn.round.big{width:8.6cqw;height:8.6cqw;font-size:3.7cqw}

  #topLeft{left:4%;top:.9%;gap:2.4cqw}
  #rotTitle{font-size:6.8cqw;letter-spacing:.45cqw;min-width:0}
  #rotTitle small{font-size:2.5cqw;letter-spacing:.12cqw;padding:.8cqw 1.5cqw;margin-top:1.1cqw}
  #topRight{display:none}

  #modeSwitch{left:50%;top:86.2%;transform:translateX(-50%)}
  .seg{border-radius:1.7cqw}
  .seg button{font-size:2.55cqw;padding:2cqw 4.4cqw;letter-spacing:0}

  #steps{left:4.5%;right:4.5%;top:7.6%;width:auto;transform:none;
         padding:2.2cqw 2.6cqw 2.4cqw;border-radius:2.2cqw}
  #steps h4{display:none}
  #legend{display:none}
  #stepList{display:flex;gap:1cqw}
  .stepRow{flex:1 1 0;padding:.4cqw 0;justify-content:center;gap:0}
  .stepRow .lbl{display:none}
  .stepRow .num{width:5.6cqw;height:5.6cqw;font-size:2.9cqw}
  #stepNow{display:block;margin-top:1.6cqw;font-size:2.9cqw;font-weight:800;color:#f0c74a}
  .ovlLeg{margin-top:1.4cqw;font-size:2.45cqw;line-height:1.4}
  #stepDesc{margin-top:1cqw;padding-top:1cqw;font-size:2.75cqw;line-height:1.42;
            max-height:38cqw;overflow-y:auto}

  #botBar{left:3%;right:3%;bottom:1.2%;flex-wrap:wrap;justify-content:center;gap:1.4cqw}
  .grp{gap:1.2cqw}
  #toZones,#toggleStand{display:none}

  #modalBox{width:94vw;max-height:88vh;padding:4cqw 4.4cqw;border-radius:3cqw}
  #modalBox h2{font-size:5.4cqw}
  #modalBox .sub{font-size:2.9cqw;margin-bottom:3cqw}
  #modalBox h3{font-size:3.6cqw;margin:3cqw 0 1.4cqw}
  #modalBox p,#modalBox li{font-size:3.1cqw;line-height:1.55}
  #modalBox li{padding-left:4cqw;margin-bottom:1.2cqw}
  #modalBox li:before{width:1.5cqw;height:1.5cqw;left:.6cqw;top:1.8cqw}
  .note{font-size:3cqw;padding:2.2cqw 2.8cqw;border-left-width:.9cqw}
  .mcols{flex-direction:column;gap:3cqw}
  .mfig{flex:none;width:100%;display:flex;flex-wrap:wrap;gap:2cqw}
  .mfig{align-items:center}
  .mfig .msvg{width:58%}
  .mcap{font-size:2.5cqw;width:36%;margin-top:0;text-align:left;line-height:1.4}
  #modalClose{right:2.6cqw;top:2.6cqw}
}
</style>
</head>
<body>
<div id="stage">
<div id="field">

  <svg id="board" preserveAspectRatio="none"></svg>

  <div id="layer">
    <div id="ball" style="left:50%;top:50%">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#f7c948" stroke="#2b2b2b" stroke-width="3"/>
      <path d="M32 3c-9 10-9 22-3 29 6 7 6 20 1 29M61 32c-12-3-22 2-27 9-5 7-16 10-26 8M9 10c3 12 12 19 21 20 9 1 17 9 20 18"
        fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/></svg>
    </div>
  </div>

  <!-- ВЕРХ СЛЕВА: ротация -->
  <div class="ui" id="topLeft">
    <button class="btn round big" id="rotPrev" title="Предыдущая расстановка">&#9664;</button>
    <div id="rotTitle">РОТАЦИЯ 1<small id="rotSub">ПЕРЕХОД 1 ИЗ 6</small></div>
    <button class="btn round big" id="rotNext" title="Следующая расстановка">&#9654;</button>
  </div>

  <!-- ВЕРХ СПРАВА: режим -->
  <div class="ui" id="topRight">
    <div id="modeTitle">ПОДАЧА</div>
  </div>

  <!-- ВЕРХ ЦЕНТР: переключатель режима -->
  <div class="ui" id="modeSwitch">
    <div class="seg">
      <button id="mServe" class="on">Мы подаём</button>
      <button id="mRecv">Мы принимаем</button>
    </div>
  </div>

  <!-- ПРАВАЯ ПАНЕЛЬ: шаги -->
  <div class="ui" id="steps">
    <h4>Ход розыгрыша</h4>
    <div id="stepList"></div>
    <div id="stepNow"></div>
    <div id="stepDesc"></div>
    <div id="legend">
      <div><i style="background:#d93a3a"></i>С — связующий</div>
      <div><i style="background:#2a7fd4"></i>Д — доигровщик</div>
      <div><i style="background:#2fa14d"></i>Ц — центральный</div>
      <div><i style="background:#fff"></i>белая цифра — зона игрока</div>
    </div>
  </div>

  <!-- НИЖНЯЯ ПАНЕЛЬ -->
  <div class="ui" id="botBar">
   <div class="grp">
    <button class="btn" id="hRules">Правила ротации</button>
    <button class="btn" id="hIdea">Смысл схемы 4-2</button>
   </div>
   <div class="grp">
    <button class="btn" id="toZones">&#8635; В зоны</button>
    <button class="btn" id="toggleStand">&#8644; Расстановка</button>
    <button class="btn" id="ovlBtn" title="Показать, что никто никого не перекрывает">&#10003; Проверка расстановки</button>
    <button class="btn round" id="prevStep" title="Шаг назад">&#9664;</button>
    <button class="btn round" id="nextStep" title="Шаг вперёд">&#9654;</button>
    <button class="btn accent" id="playAll">&#9654; Проиграть</button>
   </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО -->
  <div id="modal">
    <button class="btn round" id="modalClose">&#10005;</button>
    <div id="modalBox"></div>
  </div>

</div>
</div>

<script>
/* ======================= ДАННЫЕ ======================= */
/* Система координат площадки: наша половина x 0..300, сетка x=300, соперник 300..600.
   y 0..300 (0 — левая боковая для нас, 300 — правая). Поле отрисовки: x -60..660, y -30..330 */

const P = {
  S1:{ru:'С1', role:'setter',  color:'#d93a3a', name:'Связующий 1'},
  S2:{ru:'С2', role:'setter',  color:'#8c1f1f', name:'Связующий 2'},
  O1:{ru:'Д1', role:'outside', color:'#2a7fd4', name:'Доигровщик 1'},
  O2:{ru:'Д2', role:'outside', color:'#16508a', name:'Доигровщик 2'},
  M1:{ru:'Ц1', role:'middle',  color:'#2fa14d', name:'Центральный 1'},
  M2:{ru:'Ц2', role:'middle',  color:'#17612f', name:'Центральный 2'}
};
const IDS = ['S1','S2','O1','O2','M1','M2'];

/* Базовые точки зон */
const Z = {1:[95,240], 2:[250,240], 3:[250,150], 4:[250,60], 5:[95,60], 6:[95,150]};
const FRONT = z => z===2||z===3||z===4;

/* Три расстановки 4-2 (зона -> игрок). Дальше всё повторяется со сменой связующего */
const ROT = (function(){
  const a=[{1:'S1',2:'O1',3:'M1',4:'S2',5:'O2',6:'M2'}];
  for(let i=1;i<6;i++){ const prev=a[i-1], nxt={};
    for(let z=1;z<=6;z++) nxt[z]=prev[z%6+1];   /* переход по часовой: в 1-ю зону приходит из 2-й */
    a.push(nxt);
  }
  return a;   /* 4-6 — тот же рисунок, но у сетки второй связующий */
})();
const FORM = r => r%3;                          /* расстановка на площадке повторяется через три перехода */

/* Расстановка перед СВОЕЙ подачей (по зонам) */
const SERVE_PREP = [
  {1:[-40,250], 2:[232,186], 3:[268,152], 4:[232,118], 5:[85,55],  6:[95,150]},
  {1:[-40,250], 2:[268,182], 3:[228,150], 4:[250,55],  5:[95,120], 6:[85,205]},
  {1:[-40,250], 2:[266,235], 3:[232,158], 4:[262,105], 5:[95,110], 6:[95,175]}
];
/* Расстановка на ПРИЁМ подачи (по зонам) */
const RECV_PREP = [
  {1:[92,258], 2:[255,195], 3:[225,159], 4:[270,126], 5:[90,66], 6:[90,159]},
  {1:[92,258], 2:[228,182], 3:[265,150], 4:[255,55],  5:[90,66], 6:[90,159]},
  {1:[92,258], 2:[268,235], 3:[240,140], 4:[262,100], 5:[90,66], 6:[90,159]}
];

/* Целевые точки по амплуа */
const BASE_DEF = {                 /* база в защите: доигровщики слева, центральные в центре, связующие справа */
  front:{outside:[272,55], middle:[272,150], setter:[272,245]},
  back: {outside:[70,55],  middle:[70,150],  setter:[70,245]}
};
const DEFENSE = {                  /* соперник атакует из своей 4-й зоны (нам — справа) */
  front:{setter:[288,250], middle:[288,198], outside:[212,62]},
  back: {setter:[150,252], middle:[48,150],  outside:[75,62]}
};
const COUNTER = {                  /* мяч поднят, выходим в контратаку */
  front:{setter:[272,196], middle:[206,150], outside:[192,50]},
  back: {setter:[115,248], middle:[72,150],  outside:[95,62]}
};
const ATTACK = {                   /* момент атаки из 4-й зоны + страховка */
  front:{setter:[266,205], middle:[232,150], outside:[276,44]},
  back: {setter:[168,222], middle:[120,132], outside:[196,88]}
};
const RECV_ATTACK = {              /* после приёма: передняя линия бежит на атаку */
  front:{setter:[272,196], middle:[214,150], outside:[196,50]}
};
const RECV_SET = {
  front:{setter:[270,198], middle:[248,150], outside:[272,44]}
};

/* Тексты расстановок */
const TXT_SERVE_PREP = [

/* ======================= ПОСТРОЕНИЕ ШАГОВ ======================= */
function basePos(r){ const m={}; for(let z=1;z<=6;z++) m[ROT[r][z]] = Z[z].slice(); return m; }
function prepPos(r,src){ const m={}; for(let z=1;z<=6;z++) m[ROT[r][z]] = src[FORM(r)][z].slice(); return m; }
function byRole(r,table,keepBack){
  const m={};
  for(let z=1;z<=6;z++){
    const id=ROT[r][z], line=FRONT(z)?'front':'back';
    if(line==='back' && keepBack){ m[id]=keepBack[z].slice(); continue; }
    m[id]=table[line][P[id].role].slice();
  }
  return m;
}
function zoneOf(r,id){ for(let z=1;z<=6;z++) if(ROT[r][z]===id) return z; }
function fill(txt,r){ return txt.replace(/\{([1-6])\}/g, function(_,z){ return P[ROT[r][z]].ru; }); }
function frontSetter(r){ return [2,3,4].map(function(z){return ROT[r][z];})
  .filter(function(id){return P[id].role==='setter';})[0]; }
/* позиции «на бегу»: доля пути от расстановки к цели, своя для каждой линии */
function running(r,from,to,tFront,tBack,tServer){
  const m={};
  for(let z=1;z<=6;z++){
    const id=ROT[r][z], a=from[id], b=to[id];
    const t = FRONT(z) ? tFront : (z===1 && tServer!=null ? tServer : tBack);
    m[id]=[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
  }
  return m;
}

function buildSteps(mode,r){
  const rot=ROT[r], S=[];
  const backKeep = {}; for(let z of [1,5,6]) backKeep[z]=RECV_PREP[FORM(r)][z];
  const server = rot[1];

  if(mode==='serve'){
    S.push({t:'Расстановка по зонам', ball:[-48,258],
      pos:basePos(r), hl:[],
      d:'Так расстановка выглядит «на бумаге»: каждый игрок в своей зоне. По этим местам судья определяет порядок перехода, но <b>стоять так во время игры не обязательно</b> — важно лишь взаимное расположение в момент подачи. Не путай это с <b>базой</b> — реальными местами в защите (шаг 4).'});
    S.push({t:'Перед подачей', ball:[-42,284], pos:prepPos(r,SERVE_PREP), hl:[server],
      d:fill(TXT_SERVE_PREP[FORM(r)],r)});
    S.push({t:'Подача', ball:[386,132],
      pos:running(r, prepPos(r,SERVE_PREP), byRole(r,BASE_DEF), .62, .4, .32), hl:[server],
      d:'Удар по мячу — и <b>правило расстановки тут же перестаёт действовать</b>. Мяч ещё летит, а <b>передняя линия уже перебегает</b>: те, кто прятался «стопкой», расходятся крест-накрест по своим краям. Подающий заходит на площадку.'});
    S.push({t:'База в защите', bands:true, ball:[352,100], pos:byRole(r,BASE_DEF), hl:[],
      d:'<b>База</b> — это шесть стартовых мест в защите, куда команда возвращается каждый раз, когда мяч уходит на сторону соперника. Делится на три полосы: <b>доигровщики слева</b> (зоны 4 и 5), <b>центральные в центре</b> (3 и 6), <b>связующий и правый справа</b> (2 и 1). Передние — у сетки, задние — в глубине. База <b>одна и та же во всех трёх расстановках</b>, поэтому после подачи все бегут на знакомые места.'});
    S.push({t:'Атака соперника — защита', ball:[342,264], pos:byRole(r,DEFENSE), hl:[],
      d:'Соперник атакует из своей 4-й зоны. Двое у сетки ставят <b>блок</b>, передний доигровщик <b>оттягивается</b> от сетки под скидку, задняя линия расходится по площадке: зона 1 — за блоком по линии, зона 5 — по диагонали, зона 6 — в глубине.'});
    S.push({t:'Доигровка: выход связующего', ball:[248,176], pos:byRole(r,COUNTER), hl:[rot[2],rot[3],rot[4]].filter(id=>P[id].role==='setter'),
      d:'Мяч подняли. <b>Пасует передний связующий</b> — он просто выходит к сетке между 2-й и 3-й зоной, бежать с задней линии никому не нужно. Центральный и доигровщик уходят на разбег.'});
    S.push({t:'Атака и страховка', ball:[388,208], pos:byRole(r,ATTACK), hl:[],
      d:'Атака из 4-й зоны, остальные — на <b>страховке</b> вокруг нападающего. Выиграли мяч на своей подаче — расстановка не меняется, подаём снова. Проиграли — подаёт соперник, и мы переходим к <b>приёму</b>.'});
  } else {
    S.push({t:'Расстановка по зонам', ball:[392,52], pos:basePos(r), hl:[],
      d:'Расстановка по зонам — «на бумаге», формальный порядок для судьи. Перед приёмом игроки встанут иначе, но <b>порядок относительно соседей нарушать нельзя</b> до удара по мячу. Это не «база» — база это места в защите (шаг 7).'});
    S.push({t:'Расстановка на приём', ball:[392,52], pos:prepPos(r,RECV_PREP), hl:[],
      d:fill(TXT_RECV_PREP[FORM(r)],r)});
    S.push({t:'Подача соперника', ball:[124,182],
      pos:running(r, prepPos(r,RECV_PREP), Object.assign(prepPos(r,RECV_PREP), byRole(r,RECV_ATTACK,backKeep)), .55, 0),
      hl:[rot[6]],
      d:'Соперник ударил по мячу — <b>и передняя линия сразу срывается</b> крест-накрест на свои атакующие позиции. До касания перебегать было нельзя, судья сравнивает положение ступней. Задняя тройка остаётся на месте — ей принимать.'});
    S.push({t:'Приём — пас связующему', ball:[250,176],
      pos:Object.assign(prepPos(r,RECV_PREP), byRole(r,RECV_ATTACK,backKeep)), hl:[rot[2],rot[3],rot[4]],
      d:'Приём идёт на <b>переднего связующего</b>: он уже у сетки между 2-й и 3-й зоной. Центральный и доигровщик на бегу разбегаются крест-накрест — и <b>обязательно смотрят на мяч</b>, иначе пас прилетит за спину.'});
    S.push({t:'Передача на край', ball:[290,20],
      pos:Object.assign(prepPos(r,RECV_PREP), byRole(r,RECV_SET,backKeep)), hl:[rot[2],rot[3],rot[4]].filter(id=>P[id].role==='outside'),
      d:'Связующий отдаёт мяч. В схеме 4-2 у него <b>только два нападающих</b>: доигровщик в 4-й зоне и центральный в 3-й. Задняя линия остаётся на страховке.'});
    S.push({t:'Атака и страховка', ball:[390,216],
      pos:Object.assign(prepPos(r,RECV_PREP), byRole(r,RECV_SET,backKeep)), hl:[],
      d:'Атака из 4-й зоны. Задние игроки поджимаются под нападающего — это <b>страховка</b>: если блок соперника отобьёт мяч назад, его надо поднять.'});
    S.push({t:'Переход в защиту', bands:true, ball:[360,150], pos:byRole(r,BASE_DEF), hl:[],
      d:'Мяч ушёл к сопернику — команда возвращается в <b>базу</b>: доигровщики слева, центральные в центре, связующий и правый справа; передние у сетки, задние в глубине. Из базы уже читают атаку и двигаются на блок или в защиту. Выиграли розыгрыш — <b>переход по часовой стрелке</b> и следующая расстановка.'});
  }
  return S;
}

/* ======================= ОТРИСОВКА ======================= */
let portrait = false;
/* Координаты площадки: x — глубина (0 — наша лицевая, 300 — сетка, 600 — лицевая соперника),
   y — поперёк (0 — левая боковая). T переводит их в систему кадра. */
const VIEW = {land:{w:720,h:448}, port:{w:344,h:840}};
function VB(){ return portrait?VIEW.port:VIEW.land; }
function T(x,y){ return portrait ? [y+22, 662-x] : [x+60, y+84]; }
function XY(p){ const t=T(p[0],p[1]), v=VB(); return [t[0]/v.w*100, t[1]/v.h*100]; }
function R(x1,y1,x2,y2){ const a=T(x1,y1), b=T(x2,y2);
  return {x:Math.min(a[0],b[0]), y:Math.min(a[1],b[1]),
          w:Math.abs(b[0]-a[0]), h:Math.abs(b[1]-a[1])}; }
function rect(r,attr){ return '<rect x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" '+attr+'/>'; }

/* сама площадка */
function courtSVG(){
  const v=VB(), cl = portrait ? {x:0,y:44,w:v.w,h:672} : {x:0,y:0,w:v.w,h:v.h};
  let out='<clipPath id="cc">'+rect(cl,'')+'</clipPath><g clip-path="url(#cc)">';
  out+=rect(R(-6,-6,606,306),'rx="4" fill="#fff" style="filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))"');
  [[0,200],[200,300],[300,400],[400,600]].forEach(function(z){
    out+=rect(R(z[0]+2.5,2.5,z[1]-2.5,297.5),'fill="#8f8f8f"');
  });
  const st = portrait?9:20, n = portrait?2:3, rr = portrait?2.6:3.6;
  for(let k=1;k<=n;k++) [-k*st, 300+k*st].forEach(function(y){
    const t=T(300,y);
    out+='<circle cx="'+t[0]+'" cy="'+t[1]+'" r="'+rr+'" fill="#fff"/>';
  });
  const lab='fill="#fff" opacity=".42" font-weight="700" letter-spacing="2.2"';
  if(portrait){
    const a=T(424,150), b=T(24,150);
    out+='<text x="'+a[0]+'" y="'+a[1]+'" text-anchor="middle" font-size="12" '+lab+'>СОПЕРНИК</text>';
    out+='<text x="'+b[0]+'" y="'+b[1]+'" text-anchor="middle" font-size="12" '+lab+'>НАША СТОРОНА</text>';
  } else {
    const a=T(0,0), b=T(600,0);
    out+='<text x="'+(a[0]+3)+'" y="'+(a[1]-11)+'" font-size="11" '+lab+'>НАША СТОРОНА</text>';
    out+='<text x="'+(b[0]-3)+'" y="'+(b[1]-11)+'" text-anchor="end" font-size="11" '+lab+'>СОПЕРНИК</text>';
  }
  return out+'</g>';
}
const layer=document.getElementById('layer'), ball=document.getElementById('ball'),
      arrows=document.getElementById('board'), stepList=document.getElementById('stepList'),
      stepDesc=document.getElementById('stepDesc');

let state={mode:'serve', rot:0, step:0, steps:[], playing:null, overlap:false};
const nodes={};

IDS.forEach(id=>{
  const el=document.createElement('div');
  el.className='player'; el.style.background=P[id].color;
  el.innerHTML='<span>'+P[id].ru+'</span><span class="zbadge"></span><span class="tip">'+P[id].name+'</span>';
  layer.appendChild(el); nodes[id]=el;
});

function rebuild(keepStep){
  state.steps=buildSteps(state.mode,state.rot);
  if(!keepStep) state.step=0;
  state.step=Math.min(state.step,state.steps.length-1);
  document.getElementById('rotTitle').firstChild.textContent='РОТАЦИЯ '+(FORM(state.rot)+1);
  document.getElementById('rotSub').innerHTML='ПЕРЕХОД '+(state.rot+1)+' ИЗ 6 &nbsp;·&nbsp; ПАСУЕТ '+
    P[frontSetter(state.rot)].ru;
  document.getElementById('modeTitle').textContent = state.mode==='serve'?'ПОДАЧА':'ПРИЁМ ПОДАЧИ';
  stepList.innerHTML='';
  state.steps.forEach((s,i)=>{
    const row=document.createElement('div'); row.className='stepRow';
    row.innerHTML='<div class="num">'+(i+1)+'</div><div class="lbl">'+s.t+'</div>';
    row.onclick=()=>{stop(); go(i);};
    stepList.appendChild(row);
  });
  render();
}

function render(){
  const s=state.steps[state.step], prev= state.step>0 ? state.steps[state.step-1] : null;
  const server = state.mode==='serve' ? ROT[state.rot][1] : null;
  IDS.forEach(id=>{
    const p=s.pos[id], el=nodes[id], z=zoneOf(state.rot,id);
    const moved = prev && (Math.abs(prev.pos[id][0]-p[0])>14 || Math.abs(prev.pos[id][1]-p[1])>14);
    const xy=XY(p); el.style.left=xy[0]+'%'; el.style.top=xy[1]+'%';
    el.classList.toggle('moving',!!moved);
    el.classList.toggle('hl', s.hl.indexOf(id)>=0);
    el.classList.toggle('srv', id===server && state.step<=2);
    el.querySelector('.zbadge').textContent=z;
  });
  const bxy=XY(s.ball); ball.style.left=bxy[0]+'%'; ball.style.top=bxy[1]+'%';
  const canCheck = state.step<=1;
  const ob=document.getElementById('ovlBtn');
  ob.classList.toggle('on', state.overlap && canCheck);
  ob.disabled = !canCheck;
  document.getElementById('field').classList.toggle('check', state.overlap && canCheck);
  drawArrows(prev,s);
  [...stepList.children].forEach((r,i)=>{
    r.classList.toggle('on',i===state.step); r.classList.toggle('done',i<state.step);
  });
  document.getElementById('stepNow').textContent=(state.step+1)+' / '+state.steps.length+' · '+s.t;
  stepDesc.innerHTML = s.d + ((state.overlap && canCheck) ?
    '<div class="ovlLeg">'+
    '<div><span style="color:#5ec8ff">&#9632;</span> по глубине: передний ближе к сетке, чем его задний</div>'+
    '<div><span style="color:#8ce06a">&#9632;</span> поперёк: порядок в линии не нарушен</div>'+
    (state.mode==='serve'?'<div style="opacity:.75">подающий от правила расстановки свободен</div>':'')+
    '</div>' : '');
  document.getElementById('prevStep').disabled = state.step===0;
  document.getElementById('nextStep').disabled = state.step===state.steps.length-1;
}

/* ---------- «упор в барьер»: две стрелки навстречу и перегородка ---------- */
function barrierSVG(ax,ay,bx,by,col,off){
  const dx=bx-ax, dy=by-ay, D=Math.hypot(dx,dy);
  if(!D) return '';
  const ux=dx/D, uy=dy/D, px=-uy, py=ux;
  const x1=ax+ux*off, y1=ay+uy*off, x2=bx-ux*off, y2=by-uy*off;
  const len=D-2*off;
  if(len<5) return '';
  const half=len/2, mx=(x1+x2)/2, my=(y1+y2)/2;
  const head=Math.min(10,half*0.66), hw=head*0.58,
        gap=Math.min(2.5,half*0.14), barH=Math.max(5,Math.min(10,half*0.75));
  let out='<path d="M'+(mx+px*barH+0)+' '+(my+py*barH+0)+'L'+(mx-px*barH+0)+' '+(my-py*barH+0)+
          '" stroke="'+col+'" stroke-width="3.6" stroke-linecap="round"/>';
  [[x1,y1],[x2,y2]].forEach(function(e){
    const vx=(mx-e[0]), vy=(my-e[1]), l=Math.hypot(vx,vy);
    if(!l) return;
    const nx=vx/l, ny=vy/l;
    const tx=mx-nx*gap, ty=my-ny*gap, bx0=tx-nx*head, by0=ty-ny*head;
    out+='<path d="M'+(tx+0)+' '+(ty+0)+'L'+(bx0+px*hw+0)+' '+(by0+py*hw+0)+
         'L'+(bx0-px*hw+0)+' '+(by0-py*hw+0)+'z" fill="'+col+'"/>';
    if(l-gap-head>2.5)
      out+='<path d="M'+(e[0]+0)+' '+(e[1]+0)+'L'+(bx0+0)+' '+(by0+0)+
           '" stroke="'+col+'" stroke-width="2.9" stroke-linecap="round"/>';
  });
  return out;
}

/* проверка расстановки: стрелки напрямую между соседями */
function overlapSVG(pos,r,mode){
  const rot=ROT[r], skip=(mode==='serve')?1:0, OFF=12;
  let out='';
  [[4,5],[3,6],[2,1]].forEach(function(pr){          /* по глубине: передний — ближе к сетке */
    if(pr[1]===skip) return;
    const B=T(pos[rot[pr[1]]][0],pos[rot[pr[1]]][1]), F=T(pos[rot[pr[0]]][0],pos[rot[pr[0]]][1]);
    out+=barrierSVG(B[0],B[1],F[0],F[1],'#5ec8ff',OFF);
  });
  [[4,3],[3,2],[5,6],[6,1]].forEach(function(pr){    /* порядок внутри линии */
    if(pr[0]===skip||pr[1]===skip) return;
    const A=T(pos[rot[pr[0]]][0],pos[rot[pr[0]]][1]), B=T(pos[rot[pr[1]]][0],pos[rot[pr[1]]][1]);
    out+=barrierSVG(A[0],A[1],B[0],B[1],'#8ce06a',OFF);
  });
  return out;
}

/* полосы базы по амплуа — те же, что на схеме в подсказке «Смысл 4-2» */
const BANDS=[{y0:0,y1:102,c:'#2a7fd4',t:'ДОИГРОВЩИКИ',s:'ДОИГРОВЩИКИ'},
             {y0:102,y1:198,c:'#2fa14d',t:'ЦЕНТРАЛЬНЫЕ',s:'ЦЕНТРАЛЬНЫЕ'},
             {y0:198,y1:300,c:'#d93a3a',t:'СВЯЗУЮЩИЙ / ПРАВЫЙ',s:'СВЯЗУЮЩИЙ'}];
function bandsSVG(){
  let out='';
  BANDS.forEach(function(b){
    out+=rect(R(0,b.y0,300,b.y1),'fill="'+b.c+'" opacity=".2"');
    if(!portrait){                       /* в портрете полос хватает: подписи только мешают */
      const t=T(150,b.y0+16);
      out+='<text x="'+t[0]+'" y="'+t[1]+'" text-anchor="middle" fill="#fff" opacity=".72" '+
           'font-size="11" font-weight="800" letter-spacing="1.2">'+b.t+'</text>';
    }
  });
  return out;
}
function drawArrows(prev,s){
  const check = state.overlap && state.step<=1, v=VB();
  arrows.setAttribute('viewBox','0 0 '+v.w+' '+v.h);
  let out='<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" '+
    'markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffd54a"/></marker></defs>';
  out+=courtSVG();
  if(s.bands) out+=bandsSVG();
  if(prev && !check){
    IDS.forEach(function(id){
      const a=prev.pos[id], b=s.pos[id];
      const dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy);
      if(len<16) return;
      const RR=21, ux=dx/len, uy=dy/len;
      const A=T(a[0]+ux*RR, a[1]+uy*RR), B=T(b[0]-ux*RR, b[1]-uy*RR);
      const x1=A[0],y1=A[1],x2=B[0],y2=B[1];
      if(Math.hypot(x2-x1,y2-y1)<6) return;
      const dX=x2-x1, dY=y2-y1;
      const mx=(x1+x2)/2-dY*0.13, my=(y1+y2)/2+dX*0.13;
      out+='<path class="mv" d="M'+x1+' '+y1+' Q'+mx+' '+my+' '+x2+' '+y2+
           '" stroke="#ffd54a" stroke-width="3.2" stroke-dasharray="9 7" opacity=".85" marker-end="url(#ah)"/>';
    });
  }
  if(check) out+=overlapSVG(s.pos,state.rot,state.mode);
  arrows.innerHTML=out;
  arrows.querySelectorAll('path.mv').forEach(function(pt){
    pt.animate([{strokeDashoffset:32},{strokeDashoffset:0}],{duration:900,iterations:Infinity});
  });
}

function go(i){ state.step=Math.max(0,Math.min(i,state.steps.length-1)); render(); }
function stop(){ if(state.playing){clearInterval(state.playing); state.playing=null;
  document.getElementById('playAll').innerHTML='&#9654; Проиграть';} }
function play(){
  if(state.playing){stop();return;}
  if(state.step>=state.steps.length-1) go(0);
  document.getElementById('playAll').innerHTML='&#10074;&#10074; Пауза';
  state.playing=setInterval(()=>{
    if(state.step>=state.steps.length-1){stop();return;}
    go(state.step+1);
  },1900);
}

/* ======================= УПРАВЛЕНИЕ ======================= */
document.getElementById('rotNext').onclick=()=>{stop(); state.rot=(state.rot+1)%6; rebuild(true);};
document.getElementById('rotPrev').onclick=()=>{stop(); state.rot=(state.rot+5)%6; rebuild(true);};
document.getElementById('mServe').onclick=()=>{stop(); setMode('serve');};
document.getElementById('mRecv').onclick=()=>{stop(); setMode('recv');};
function setMode(m){
  state.mode=m;
  document.getElementById('mServe').classList.toggle('on',m==='serve');
  document.getElementById('mRecv').classList.toggle('on',m==='recv');
  rebuild(true);
}
document.getElementById('toZones').onclick=()=>{stop(); go(0);};
document.getElementById('toggleStand').onclick=()=>{stop(); go(state.step===0?1:0);};
document.getElementById('prevStep').onclick=()=>{stop(); go(state.step-1);};
document.getElementById('nextStep').onclick=()=>{stop(); go(state.step+1);};
document.getElementById('ovlBtn').onclick=()=>{ state.overlap=!state.overlap; render(); };
document.getElementById('playAll').onclick=play;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){stop();go(state.step+1);}
  if(e.key==='ArrowLeft'){stop();go(state.step-1);}
  if(e.key===' '){e.preventDefault();play();}
  if(e.key==='Escape') closeModal();
});

/* ======================= ПОДСКАЗКИ ======================= */
const modal=document.getElementById('modal'), modalBox=document.getElementById('modalBox');
document.getElementById('modalClose').onclick=closeModal;
modal.onclick=e=>{ if(e.target===modal) closeModal(); };
function closeModal(){ modal.classList.remove('open'); }
const closeBtn=document.getElementById('modalClose');
function openModal(html){ modalBox.innerHTML=html; modalBox.appendChild(closeBtn); modal.classList.add('open'); modalBox.scrollTop=0; }

/* схема половины площадки: зоны, переход, пары перекрытия */
function svgZones(opts){
  const o=Object.assign({loop:false,order:false,labels:null,pairs:false,opp:false,bands:false},opts||{});
  const Zc={1:[110,240],2:[305,240],3:[305,155],4:[305,70],5:[110,70],6:[110,155]};
  let s='<svg class="msvg" viewBox="0 0 400 305">';
  s+='<rect x="18" y="18" width="364" height="264" rx="6" fill="none" stroke="#fff" stroke-width="5"/>';
  s+='<line x1="262" y1="18" x2="262" y2="282" stroke="#fff" stroke-width="3" opacity=".7"/>';
  s+='<line x1="384" y1="6" x2="384" y2="294" stroke="#fff" stroke-width="4" stroke-dasharray="5 9" opacity=".9"/>';
  s+='<text x="376" y="302" fill="#fff" opacity=".5" font-size="13" font-weight="700" text-anchor="end">СЕТКА</text>';
  if(o.bands){
    [[18,112.5,'#2a7fd4','ДОИГРОВЩИКИ'],[112.5,197.5,'#2fa14d','ЦЕНТРАЛЬНЫЕ'],
     [197.5,282,'#d93a3a','СВЯЗУЮЩИЙ / ПРАВЫЙ']].forEach(function(b){
      s+='<rect x="20" y="'+b[0]+'" width="360" height="'+(b[1]-b[0])+'" fill="'+b[2]+'" opacity=".2"/>';
      s+='<text x="200" y="'+((b[0]+b[1])/2-32)+'" text-anchor="middle" fill="#fff" opacity=".65" '+
         'font-size="12" font-weight="800" letter-spacing="1.2">'+b[3]+'</text>';
    });
  }
  if(o.loop){
    [[1,6],[6,5],[5,4],[4,3],[3,2],[2,1]].forEach(function(pr){
      const A=Zc[pr[0]],B=Zc[pr[1]],dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy),R=30;
      const x1=A[0]+dx/L*R,y1=A[1]+dy/L*R,x2=B[0]-dx/L*R,y2=B[1]-dy/L*R;
      const mx=(x1+x2)/2-dy/L*L*0.15,my=(y1+y2)/2+dx/L*L*0.15;
      s+='<path d="M'+x1+' '+y1+' Q'+mx+' '+my+' '+x2+' '+y2+'" fill="none" stroke="#ffd54a" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#mah)"/>';
    });
  }
  if(o.pairs){
    [[4,5],[3,6],[2,1]].forEach(function(pr){
      const F=Zc[pr[0]],B=Zc[pr[1]];
      s+=barrierSVG(B[0],B[1],F[0],F[1],'#5ec8ff',27);
    });
  }
  if(o.opp){   /* диагонали: кто кому «противоположный» */
    [[4,5],[3,6],[2,1]].forEach(function(pr){
      const F=Zc[pr[0]],B=Zc[pr[1]];
      s+='<path d="M'+(B[0]+27)+' '+B[1]+'L'+(F[0]-27)+' '+F[1]+'" stroke="#ffd54a" stroke-width="3" '+
         'stroke-dasharray="7 6" opacity=".9" marker-start="url(#mahs)" marker-end="url(#mah)"/>';
    });
  }
  if(o.order){
    [[4,3],[3,2],[5,6],[6,1]].forEach(function(pr){
      s+=barrierSVG(Zc[pr[0]][0],Zc[pr[0]][1],Zc[pr[1]][0],Zc[pr[1]][1],'#8ce06a',27);
    });
  }
  for(let z=1;z<=6;z++){
    const c=Zc[z],lab=o.labels?o.labels[z]:null;
    s+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="24" fill="'+(lab?lab.color:'#6a6a6a')+'" stroke="#fff" stroke-width="3"/>';
    s+='<text x="'+c[0]+'" y="'+(c[1]+7)+'" text-anchor="middle" fill="#fff" font-size="'+(lab?17:21)+'" font-weight="800">'+(lab?lab.t:z)+'</text>';
    if(lab){
      s+='<circle cx="'+(c[0]+20)+'" cy="'+(c[1]-20)+'" r="10.5" fill="#fff"/>';
      s+='<text x="'+(c[0]+20)+'" y="'+(c[1]-16)+'" text-anchor="middle" fill="#2b2b2b" font-size="13" font-weight="800">'+z+'</text>';
    }
  }
  s+='<defs><marker id="mah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd54a"/></marker>';
  s+='<marker id="mahs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffd54a"/></marker>';
  s+='</defs></svg>';
  return s;
}
